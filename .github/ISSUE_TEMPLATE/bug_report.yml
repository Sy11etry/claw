name: Bug report
description: The compiler or the standard library does something wrong
labels: [bug]
body:
  - type: textarea
    id: program
    attributes:
      label: The smallest program that shows it
      render: claw
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      placeholder: claw run bug.claw
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what you got
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: "`claw --version` and your Mac (chip, macOS version)"
    validations:
      required: true
  - type: textarea
    id: trace
    attributes:
      label: Crash recording (optional)
      description: "If the program trapped: run it as `CLAW_RECORD=crash.clawtrace ./program` and attach the file."
